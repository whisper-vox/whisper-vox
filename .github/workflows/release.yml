name: Build & Release

# Builds the Windows installer and the macOS app on every supported machine.
# Triggered by pushing a version tag (e.g. v1.2.0) or manually. The CI-built
# binaries are what get published - a locally built one is for testing only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write          # needed to create the GitHub Release

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not throw away a good build of the other.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: WhisperVox-Setup-windows
            files: release/*.zip
          # Two .dmg files, one per architecture, because a single fat binary is
          # not reachable in this stack: numpy, Pillow and soundfile all publish
          # separate arm64 and x86_64 wheels and no universal2 one at all, and
          # PyInstaller can only produce a universal build when EVERY native
          # dependency is universal. Each runner builds for its own machine -
          # the spec sets no target_arch, so PyInstaller follows the host.
          #
          # Apple Silicon is the download to offer first. The Intel one also runs
          # on Apple Silicon through Rosetta, so it stays the safe fallback -
          # while the reverse is impossible, arm64 code will not run on Intel.
          - os: macos-latest          # arm64
            artifact: WhisperVox-macos-AppleSilicon
            files: release/*.dmg
          - os: macos-15-intel
            artifact: WhisperVox-macos-Intel
            files: release/*.dmg
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Recreate the same .venv layout the build scripts expect locally.
      - name: Set up virtual environment (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\pip install -r requirements.txt pyinstaller

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File build/build_all.ps1

      - name: Set up virtual environment (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt pyinstaller

      # Produces an UNSIGNED, un-notarized .dmg: ad-hoc signed only, so macOS
      # asks the user to allow it by hand. See build/build_mac.sh.
      - name: Build app and dmg (macOS)
        if: runner.os == 'macOS'
        run: bash build/build_mac.sh

      - name: Upload build
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}

      # ─────────────────────────────────────────────────────────────────────────
      # CODE SIGNING via SignPath Foundation (Windows) - ENABLE AFTER APPROVAL.
      # Once the project is approved at signpath.org and the repo secrets below
      # exist, uncomment this. It submits the Windows artifact to SignPath and
      # waits for the signed file, which the release job then publishes instead.
      #
      # Required repository secrets (Settings > Secrets and variables > Actions):
      #   SIGNPATH_API_TOKEN  - user token from your SignPath account
      #   SIGNPATH_ORG_ID     - your SignPath organization id
      # And set project-slug / signing-policy-slug to match your SignPath project.
      #
      # macOS signing is a separate matter entirely: it needs an Apple Developer
      # ID ($99/year), codesign --options runtime and notarytool. SignPath does
      # not cover it.
      #
      # - name: Sign with SignPath
      #   if: runner.os == 'Windows'
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
      #     project-slug: whisper-vox
      #     signing-policy-slug: release-signing
      #     github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: release-signed
      # ─────────────────────────────────────────────────────────────────────────

  # One release, both platforms. Kept in its own job so the notes are written
  # once: two jobs publishing to the same release would race over the body.
  release:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Single-sourced from launcher.py, the same value both build scripts use.
      - name: Read app version
        id: ver
        run: echo "version=$(sed -n "s/^APP_VERSION *= *'\(.*\)'/\1/p" build/launcher.py)" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: List what will be published
        run: find artifacts -type f | sort

      # Runs BEFORE the publish step and is not allowed to fail: an asset the
      # app cannot recognise breaks one-click updates silently, for everyone,
      # and only becomes visible when someone tries to update. Better to have no
      # release than a release nobody can update to.
      - name: Check the assets match what the app looks for
        run: |
          python3 -m pip install --quiet pyyaml
          python3 tools/check-release-assets.py

      - name: Publish GitHub Release (unsigned)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Whisper Vox v${{ steps.ver.outputs.version }}
          files: |
            artifacts/**/*.zip
            artifacts/**/*.dmg
          body: |
            **Whisper Vox v${{ steps.ver.outputs.version }}** - AI-powered voice-to-text dictation. Hold a key, speak, release - your words appear in any app.

            ### Windows

            **First run.** Windows SmartScreen may show a *"Windows protected your PC"* / *Unknown publisher* message. The app is safe - the full source is public and this binary is built by GitHub Actions CI directly from it. Click **More info**, then **Run anyway**.

            **Install.**
            1. Download **`WhisperVox-Setup-v${{ steps.ver.outputs.version }}.zip`** below and extract it (the `.zip` also avoids the browser's "this file is dangerous" prompt).
            2. Run **`WhisperVox-Setup.exe`** from inside the extracted folder - it installs for your user account (no admin rights needed), then starts in the system tray.

            **Uninstall.** Windows **Settings → Apps → Whisper Vox → Uninstall**.

            ### macOS

            Needs macOS 13 (Ventura) or newer. There are two downloads - take the one that matches your Mac:

            - **`WhisperVox-v${{ steps.ver.outputs.version }}-AppleSilicon.dmg`** - M1 and newer.
            - **`WhisperVox-v${{ steps.ver.outputs.version }}-Intel.dmg`** - Intel Macs. It also runs on Apple Silicon, translated through Rosetta, if you would rather not think about it.

            Not sure which you have? **Apple menu → About This Mac**: a line saying *Chip* means Apple Silicon, one saying *Processor* means Intel.

            **Install.**
            1. Open the `.dmg` and drag **WhisperVox.app** onto the Applications folder. **Open it from Applications, not from the disk image** - macOS will not remember permissions for an app running off a mounted image.
            2. The first launch is blocked, because this build is not signed by Apple: open **System Settings → Privacy & Security**, scroll down, and click **Open Anyway** next to the Whisper Vox message.
            3. Whisper Vox sits in the **menu bar** and keeps a Dock icon, so you can reach it either way.

            **Permissions.** macOS gates two of the things the app does, and it will list them under **Settings → Misc** with a button for each:
            - **Microphone** - to hear you.
            - **Accessibility** - to type the text into other apps.

            The activation key needs no permission at all: macOS registers it for the app. It starts as **Ctrl+Escape** and can be changed on the Recording tab - pick something nothing else uses, because macOS gives a chord to whichever app asked first and never reports that one is taken.

            Until the app is signed with an Apple Developer ID, macOS forgets both permissions after every update and you have to switch them on again.

            ### Then

            Open the window, choose a transcription service, and paste your API key. A free key is available from Groq: https://console.groq.com/keys

            Press your activation key (**F2** on Windows, **Ctrl+Escape** on macOS) and speak.
